name: MEDICUS PRIME - Smoke Test

on:
  push:
    paths:
      - '.github/workflows/medicus_prime_smoke_test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r medicus-prime-medical-watch/requirements.txt

      - name: Run MEDICUS PRIME with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        working-directory: medicus-prime-medical-watch
        run: |
          python src/medical_watch.py
          test -s knowledge/medical_update.md
          test -s knowledge/medical_update.json
          echo "Smoke test completed and knowledge files were generated."
